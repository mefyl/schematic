[versions]
guava = "33.0.0-jre"
junit-jupiter-engine = "5.10.2"
kotlin = "2.0.20"
kotlinx-serialization-json = "1.7.2"
kotlinx-serialization-datetime = "0.6.1"

[libraries]
guava = { module = "com.google.guava:guava", version.ref = "guava" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter-engine" }
kotlinx-serialization-json = {group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json"}
kotlinx-serialization-datetime = {group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinx-serialization-datetime"}

[plugins]
jvm = { id = "org.jetbrains.kotlin.jvm", version = "1.9.22" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
