include:
  - local: '/.logistic/ci/.gitlab-ci-template.yml'

toolchain:
  extends: .ocaml-toolchain
  variables:
    OCAML_VERSION: "4.14.0"

build:
  extends: .ocaml-build
  dependencies:
    - toolchain
  needs:
    - toolchain
  variables:
    OCAML_VERSION: "4.14.0"

check:
  extends: .ocaml-check
  dependencies:
    - build
  needs:
    - build
  variables:
    OCAML_VERSION: "4.14.0"

package:
  extends: .ocaml-package
  dependencies:
    - check
  needs:
    - check
  variables:
    OCAML_VERSION: "4.14.0"

opam:
  extends: .ocaml-opam
  dependencies:
    - check
  needs:
    - check
  variables:
    OCAML_VERSION: "4.14.0"
