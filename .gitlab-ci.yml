include:
  - local: '/.logistic/ci/.gitlab-ci.yml'

variables:
    DOCKERFILE_BASE: "ubuntu"
    OCAML_VERSION: "4.14.0"

toolchain:
  extends: .ocaml-toolchain
  variables:
    # Opam does not install sqml with `--deps-only` because it depends
    # (optionally) on schematic via timmy.
    OPAM_PACKAGES: "sqml.0.4.4"
